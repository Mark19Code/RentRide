databases:
  - name: rentride-db
    databaseName: rentride
    user: rentride
    plan: free
    region: singapore

services:
  - type: web
    name: rentride
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_data --skip-admin && python manage.py bootstrap_admins && gunicorn rentride.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentride-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DJANGO_ADMIN_1_USERNAME
        value: "ampal"
      - key: DJANGO_ADMIN_1_PASSWORD
        sync: false
      - key: DJANGO_ADMIN_2_USERNAME
        value: "mandadero"
      - key: DJANGO_ADMIN_2_PASSWORD
        sync: false
      - key: DJANGO_ADMIN_3_USERNAME
        value: "buenaventura"
      - key: DJANGO_ADMIN_3_PASSWORD
        sync: false
